{% extends 'base.html' %}
{% block title %}{{ action }} Book - BL-Library{% endblock %}
{% block content %}

<div class="row">
  <div class="col-md-8 offset-md-2">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">{{ action }} Book</h2>
      </div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          <input type="hidden" name="MAX_FILE_SIZE" value="104857600">

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" class="form-select form-select-lg">
              <option value="School" {% if book and book.category|lower=='school' %}selected{% endif %}>School</option>
              <option value="Fiction" {% if book and book.category|lower=='fiction' %}selected{% endif %}>Fiction</option>
              <option value="General" {% if not book or book.category|lower=='general' %}selected{% endif %}>General</option>
              <option value="Science" {% if book and book.category|lower=='science' %}selected{% endif %}>Science</option>
              <option value="Self-Help" {% if book and book.category|lower=='self-help' %}selected{% endif %}>Self-Help</option>
              <option value="Reference" {% if book and book.category|lower=='reference' %}selected{% endif %}>Reference</option>
              <option value="Non-Fiction" {% if book and book.category|lower=='non-fiction' %}selected{% endif %}>Non-Fiction</option>
            </select>
          </div>

          <div class="form-group">
            <label for="title">Title *</label>
            <input
              id="title"
              name="title"
              class="form-control form-control-lg"
              placeholder="Enter book title"
              value="{{ book.title if book else '' }}"
              required
            >
          </div>

          <div class="form-group">
            <label for="author">Author *</label>
            <input
              id="author"
              name="author"
              class="form-control form-control-lg"
              placeholder="Enter author name"
              value="{{ book.author if book else '' }}"
              required
            >
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="year">Publication Year</label>
                <input
                  id="year"
                  name="year"
                  type="number"
                  class="form-control form-control-lg"
                  placeholder="e.g., 2024"
                  value="{{ book.year if book and book.year else '' }}"
                >
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="isbn">ISBN <span class="text-muted small" style="font-weight: normal;">(optional)</span></label>
                <input
                  id="isbn"
                  name="isbn"
                  class="form-control form-control-lg"
                  placeholder="Optional (e.g., 978-3-16-148410-0)"
                  value="{{ book.isbn if book else '' }}"
                >
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              class="form-control"
              rows="6"
              placeholder="Enter a detailed description of the book"
            >{{ book.description if book else '' }}</textarea>
          </div>

          <div class="form-group">
            <label for="file">Upload PDF (optional)</label>
            <div class="input-group">
              <input
                id="file"
                type="file"
                name="file"
                accept="application/pdf"
                class="form-control form-control-lg"
              >
              <span class="input-group-text">PDF only (Max 100MB)</span>
            </div>
            <small style="color: #999; display: block; margin-top: 5px;">
              {% if book and book.filename %}
                Current file: <strong>{{ book.filename }}</strong> - Upload a new file to replace it.
              {% endif %}
            </small>
          </div>

          <div style="border-top: 1px solid #ddd; padding-top: 20px; margin-top: 30px;">
            <button type="submit" class="btn btn-primary btn-lg">
              ✅ {{ action }}
            </button>
            <a class="btn btn-secondary btn-lg" href="{{ url_for('index') }}">
              ❌ Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
