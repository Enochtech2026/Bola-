{% extends 'base.html' %}
{% block title %}Sign In - BL-Library{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Sign In to Your Account</h2>
    <p class="small">Please complete the form below to access your account</p>
    
    <form method="post" class="mt-4">
      <div class="form-group">
        <label for="username">Matric No or Email</label>
        <input 
          id="username"
          name="username" 
          class="form-control form-control-lg" 
          placeholder="Enter your Matric No or Email" 
          required
          autofocus
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          name="password" 
          type="password" 
          class="form-control form-control-lg" 
          placeholder="Enter your password"
          required
        >
      </div>
      
      <button type="submit" class="btn btn-primary btn-lg w-100">
        Sign In
      </button>
    </form>
    
    <div class="auth-links">
      <a href="{{ url_for('forgot_password') }}">Forgot password? Click here!</a>
      <span style="color: #999;">—</span>
      <a href="{{ url_for('register') }}">Don't have an account? Register!</a>
    </div>
  </div>
</div>
{% endblock %}
