{% extends 'base.html' %}
{% block title %}Reset Password - BL-Library{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Your Password</h2>
    <p class="small">Enter your Matric No or email address and we'll send you a link to reset your password.</p>
    
    <form method="post" class="mt-4">
      <div class="form-group">
        <label for="identifier">Matric No or Email *</label>
        <input 
          id="identifier"
          name="identifier" 
          class="form-control form-control-lg" 
          placeholder="Enter your Matric No or email"
          required
          autofocus
        >
      </div>
      
      <button type="submit" class="btn btn-primary btn-lg w-100">
        Send Reset Link
      </button>
    </form>
    
    <div class="auth-links">
      <a href="{{ url_for('login') }}">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
